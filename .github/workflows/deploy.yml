# Deploy both Workers on a push to main. The PR gate is ci.yml: main only takes
# squash merges that already passed there, so this re-runs the same two checks
# and stops if either fails rather than trusting the merge.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # Both deployments come off the same commit, so a change that lands in
      # one is never left out of the other.
      - name: Deploy strategy
        run: pnpm exec wrangler deploy --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy pit
        run: pnpm exec wrangler deploy --env pit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
